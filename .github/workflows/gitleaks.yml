name: "Security: Secret Scanning (Gitleaks)"

# Open-source scanner that needs no account or secret, so it also runs for pull requests from forks. It complements the
# GitGuardian workflow (which needs the GITGUARDIAN_API_KEY repository secret).
on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks scan
    runs-on: ubuntu-latest
    env:
      # Pinned binary: the version AND its sha256 (from the release's gitleaks_<version>_checksums.txt), verified before it runs.
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          fetch-depth: 0 # scan the full history, not only the tip
      - name: Install Gitleaks (checksum-verified)
        run: |
          set -euo pipefail
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          rm gitleaks.tar.gz
      - name: Scan git history (secret values are redacted in the log)
        run: ./gitleaks git . --config .gitleaks.toml --redact --no-banner --exit-code 1